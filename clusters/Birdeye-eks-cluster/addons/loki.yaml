# ============================================================
# Grafana Loki - Birdeye EKS
# Chart Version: 7.3.0
# ============================================================

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  useTestSchema: true

  storage:
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin

  chunksCache:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 2Gi

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0
