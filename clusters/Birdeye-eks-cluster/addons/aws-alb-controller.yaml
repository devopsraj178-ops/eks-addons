# ============================================================
# AWS Load Balancer Controller - Birdeye EKS
# Chart Version: 3.5.0
# ============================================================

clusterName: Birdeye-eks-cluster

# AWS region
region: us-east-1

# Set the IAM/IRSA service account after IAM role creation.
serviceAccount:
  create: true
  name: aws-load-balancer-controller

# Run controller on Linux nodes
nodeSelector:
  kubernetes.io/os: linux

# Common production setting
replicaCount: 2

# Optional resource tuning
# resources:
#   requests:
#     cpu: 100m
#     memory: 128Mi
#   limits:
#     cpu: 500m
#     memory: 512Mi
