apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: birdeye-addons
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: grafana
            path: addons/grafana
            values: clusters/Birdeye-eks-cluster/addons/grafana.yaml
            namespace: monitoring

          - name: ingress-nginx
            path: addons/ingress-nginx
            values: clusters/Birdeye-eks-cluster/addons/ingress-nginx.yaml
            namespace: ingress-nginx

          - name: keda
            path: addons/keda
            values: clusters/Birdeye-eks-cluster/addons/keda.yaml
            namespace: keda

          - name: loki
            path: addons/loki
            values: clusters/Birdeye-eks-cluster/addons/loki.yaml
            namespace: loki

          - name: prometheus
            path: addons/kube-prometheus-stack
            values: clusters/Birdeye-eks-cluster/addons/kube-prometheus-stack.yaml
            namespace: monitoring

          - name: statsd-exporter
            path: addons/statsd-exporter
            values: clusters/Birdeye-eks-cluster/addons/statsd-exporter.yaml
            namespace: monitoring

          - name: tempo
            path: addons/tempo
            values: clusters/Birdeye-eks-cluster/addons/tempo.yaml
            namespace: tempo

          - name: aws-load-balancer-controller
            path: addons/aws-alb-controller
            values: clusters/Birdeye-eks-cluster/addons/aws-alb-controller.yaml
            namespace: kube-system

  template:
    metadata:
      name: '{{name}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/devopsraj178-ops/eks-addons.git
        targetRevision: main
        path: '{{path}}'
        helm:
          valueFiles:
            - '../../{{values}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
